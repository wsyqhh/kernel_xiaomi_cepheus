name: Build cepheus kernel

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Ref used for the verification build
        required: true
        default: sixteen-test
  push:
    branches:
      - codex/cloud-kernel-build

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: verify
            ref_kind: source
            config_fragment: ""
          - variant: docker-droidspace
            ref_kind: workflow
            config_fragment: kernel/configs/phone-droidspace-docker.config

    steps:
      - name: Checkout CI files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          path: ci
          fetch-depth: 1

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref_kind == 'source' && (github.event.inputs.source_ref || 'sixteen-test') || github.ref_name }}
          path: source
          fetch-depth: 1

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex git zip unzip cpio rsync python3 \
            libssl-dev libelf-dev dwarves \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            lld llvm

      - name: Fetch Android clang
        run: |
          set -eux
          CLANG_ROOT="$RUNNER_TEMP/android-clang"
          git clone --depth=1 --filter=blob:none --sparse \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "$CLANG_ROOT"
          git -C "$CLANG_ROOT" sparse-checkout set clang-r536225
          echo "CLANG_BIN=$CLANG_ROOT/clang-r536225/bin" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.variant }}
        run: |
          bash ci/scripts/ci/build-kernel.sh "source" "ci" "${{ matrix.variant }}" "${{ matrix.config_fragment }}"

      - name: Upload ${{ matrix.variant }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: cepheus-${{ matrix.variant }}-${{ github.run_number }}
          path: source/artifacts/${{ matrix.variant }}/*
          if-no-files-found: error
